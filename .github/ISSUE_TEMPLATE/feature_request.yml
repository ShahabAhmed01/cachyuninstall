name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are public. For vulnerabilities, use GitHub's
        **Security tab → "Report a vulnerability"** instead — see
        [`SECURITY.md`](https://github.com/ShahabAhmed01/cachyuninstall/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What real problem does this solve? Who hits it?
      placeholder: Describe the concrete problem and who is affected.
    validations:
      required: true
  - type: textarea
    id: proposed_behavior
    attributes:
      label: Proposed behavior
      description: Concrete, testable description of the change you want.
      placeholder: Describe how it should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What did you try instead?
      placeholder: Describe workarounds or alternative designs you considered.
    validations:
      required: true
  - type: textarea
    id: safety_impact
    attributes:
      label: Safety impact
      description: |
        Does this touch the privilege boundary, deletion policy, or leftover
        rules? Evidence for new leftover rules is required
        (docs/LEFTOVER_DETECTION.md); the rule database is not expanded
        without evidence + tests.
      placeholder: "None / describe the impact on the privilege boundary, deletion policy, or leftover rules."
    validations:
      required: true
  - type: checkboxes
    id: evidence_ack
    attributes:
      label: Acknowledgement
      options:
        - label: I understand that changes to leftover rules require evidence (docs/LEFTOVER_DETECTION.md) and tests before the rule database is expanded.
          required: true
