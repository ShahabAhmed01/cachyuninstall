[mypy]
mypy_path = src
strict = true
warn_return_any = true
disallow_any_generics = true

# Third-party bindings with incomplete typing are isolated here.
[mypy-pyalpm.*]
ignore_missing_imports = true

[mypy-dbus.*]
ignore_missing_imports = true

[mypy-dbus.service.*]
ignore_missing_imports = true

[mypy-tests.harness.*]
# The fake ALPM harness intentionally uses partial structures.
disallow_untyped_defs = false

# PyQt6's bundled stubs annotate pyqtClassInfo/pyqtSlot(result=) with Qt's C++
# signatures rather than the Python runtime behavior (stub bug). Errors are
# disabled ONLY for the one D-Bus service module that must use them; usages are
# runtime-verified (see docs/DECISIONS.md D4 probing notes).
[mypy-cachyuninstall.privilege.service]
disable_error_code = func-returns-value, misc, arg-type

