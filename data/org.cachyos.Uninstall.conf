<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- The helper runs as root and owns the well-known name. -->
  <policy user="root">
    <allow own="org.cachyos.Uninstall"/>
  </policy>

  <!-- Unprivileged users may call the interface (polkit still guards
       privileged operations) and receive progress signals. -->
  <policy context="default">
    <allow send_destination="org.cachyos.Uninstall"
           send_interface="org.cachyos.Uninstall"/>
    <allow send_destination="org.cachyos.Uninstall"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>

</busconfig>
